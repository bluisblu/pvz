# BETA_099 build config. See config.example.yml for full documentation
# of every key.

delink:
  repo: "HaydnTrigg/delink"
  version: "v0.15.0"
  asset_name: "delink-{os}-{arch}{ext}"

# --- Split target --------------------------------------------------------
# symbols.txt:  `name = section:0xADDR; // type:function|object size:0xSIZE`
# splits.txt:   `Sections:` block, then per-source-file `section start:0x.. end:0x..`
#               ranges. File keys are real source paths relative to src/
#               (e.g. Popcap/Lawn/Zombie.cpp) and ARE the TU names -- there is
#               no separate obj->source mapping any more.
# Both are real ninja inputs: edit either and `ninja` re-splits. Seeded from
# the 0.9.9 .map by scripts/map_to_symbols_splits.py.
target:
  binary: "orig/{version}/PlantsVsZombies.exe"
  symbols: "config/{version}/symbols.txt"
  splits: "config/{version}/splits.txt"

  # Fields symbols.txt/splits.txt can't carry; forwarded as CLI flags to
  # scripts/symbols_splits_to_json.py.
  ida:
    arch: "x86"
    procname: "x86"
    bits: 32
    endian: "little"
    filetype: "PE"
    image_base: "0x00400000"
    input_file: "PlantsVsZombies.exe"

compiler:
  id: msvc8
  toolchain:
    env: "MSVC8_DIR"
    repo: "widberg/msvc8.0"
    ref: "d6c4aa208c8345c78a9f68ba6ef911ee94c6a6e1"
  arch: x86

  extra_includes:
    - env: "DXSDK_DIR"
      fallback: 'C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)'
      subpath: "Include"

  include_dirs:
    - "src/lib/SexyAppFramework"
    - "src/lib"
    - "src/Popcap/Lawn"
    - "src"

  base_flags: >-
    /nologo /EHsc /MT /O2 /Ob2 /Oi /Gy /GS- /GR-
    /D_CRT_SECURE_NO_DEPRECATE /D_CRT_NONSTDC_NO_DEPRECATE

link:
  enabled: false # relinking is currently broken upstream; see config.example.yml

  output: "PlantsVsZombies.exe"
  subsystem: "windows"
  target: "exe"

  base_address: "0x00400000"
  stack_reserve: "0x100000"
  stack_commit: "0x1000"

  lib_dirs:
    - env: "DXSDK_DIR"
      fallback: 'C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)'
      subpath: "Lib/x86"

  libs:
    - "user32.lib"
    - "gdi32.lib"
    - "winmm.lib"
    - "ddraw.lib"
    - "dxguid.lib"
    - "dsound.lib"
    - "d3d8.lib"
    - "d3dx8.lib"
    - "wsock32.lib"
    - "comctl32.lib"

  # /FORCE:MULTIPLE + /OPT:NOICF are required, not optional -- see config.example.yml
  extra_flags: >-
    /MAP /OPT:REF /OPT:NOICF /INCREMENTAL:NO /FORCE:MULTIPLE

  # status:
  #   matching:
  #     - "Popcap/Lawn/Plant.cpp"

objdiff:
  min_version: "2.0.0-beta.5"
  unit_prefix: "main"
  progress_categories: ["game"]
  watch_patterns:
    - "*.c"
    - "*.cp"
    - "*.cpp"
    - "*.h"
    - "*.hpp"
    - "*.inc"
    - "*.py"
    - "*.yml"
    - "*.txt"
    - "*.json"
