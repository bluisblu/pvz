# Project build configuration for version BETA_099.
#
# This file is the single source of truth for compiler selection, flags,
# include paths, object->source remapping, and per-file overrides.
# configure.py itself contains no game- or compiler-specific hardcoding —
# everything here is what a fork would edit to target a different
# game/compiler/toolchain.

# --- Delink (PE splitter) ---------------------------------------------------
delink:
  repo: "HaydnTrigg/delink"
  version: "v0.14.0"
  # {os} / {arch} / {ext} are substituted by configure.py based on host platform
  asset_name: "delink-{os}-{arch}{ext}"

# --- Source binaries used as the split target -------------------------------
target:
  exe: "orig/{version}/PlantsVsZombies.exe"
  pdb: "orig/{version}/PlantsVsZombies.pdb"

# --- Object -> source path remapping ----------------------------------------
# delink dumps every translation unit as a flat "<NNNN>_<Name>.obj" file
# (e.g. "0001_Zombie.obj") with no directory structure and no knowledge of
# where the source actually lives in the tree. This section is what tells
# configure.py "this flat obj corresponds to this source file".
#
# Start here with plain manual entries — keyed by the flat obj basename
# (no ".obj" extension, no path), valued by the source path relative to
# src/ (no extension). That's it; add one line per file as you match them:
#
#   manual:
#     "0001_Zombie": "Popcap/Lawn/releasebeta/Zombie"
#     "0002_ZenGarden": "Popcap/Lawn/releasebeta/ZenGarden"
#
# configure.py appends ".obj" on the delink side and ".cpp"/".obj" as
# appropriate on the source/build side, so you never write extensions here.
#
# Later, once naming conventions are known (e.g. a consistent "NNNN_"
# prefix), a `rules:` list of regex-based patterns can be added alongside
# `manual:` to auto-derive mappings in bulk, with `manual:` entries always
# taking precedence over anything a rule would produce. configure.py
# already resolves mappings that way — rules are just not populated yet.
paths:
  manual:
    "__shared_data": "__shared_data"
    "0001_Zombie": "Popcap/Lawn/Zombie"
    "0002_ZenGarden": "Popcap/Lawn/ZenGarden"
    "0003_UserDialog": "Popcap/Lawn/UserDialog"
    "0004_TypingCheck": "Popcap/Lawn/TypingCheck"
    "0005_Trail": "Popcap/Lawn/TodLib/Trail"
    "0006_ToolTipWidget": "Popcap/Lawn/ToolTipWidget"
    "0007_TodStringFile": "Popcap/Lawn/TodLib/TodStringFile"
    "0008_TodParticle": "Popcap/Lawn/TodLib/TodParticle"
    "0009_TodFoley": "Popcap/Lawn/TodLib/TodFoley"
    "0010_TodDebug": "Popcap/Lawn/TodLib/TodDebug"
    "0011_TodCommon": "Popcap/Lawn/TodLib/TodCommon"
    "0012_Tod_SWTri": "Popcap/Lawn/TodLib/Tod_SWTri"
    "0013_TitleScreen": "Popcap/Lawn/TitleScreen"
