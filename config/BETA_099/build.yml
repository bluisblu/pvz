# --- Compiler toolchain -------------------------------------------------
# The MSVC8/VC80 toolchain itself is bootstrapped automatically by
# configure.py -- no Visual Studio install required, on any OS. It
# downloads widberg/msvc8.0 (a portable extraction of VS2005's VC80,
# the exact same source decomp.me's own MSVC8 Docker image uses) into
# build/tools/msvc8.0/{Bin,Include,Lib} on first run and reuses it after
# that. On non-Windows hosts, configure.py also bootstraps `wibo`
# (https://github.com/decompals/wibo), a lightweight cli-only Windows
# binary runner, and prefixes every cl.exe/link.exe invocation with it.
#
# `toolchain:` below controls that bootstrap. `env` still lets a
# contributor point at their own install first (e.g. a real VS2005/VS8
# on Windows) before configure.py downloads anything; set the env var to
# a directory containing Bin/ and Include/ (and Lib/ if you also want to
# supply the Platform SDK libs yourself) to skip the download entirely.
compiler:
  id: msvc8
  toolchain:
    env: "MSVC8_DIR"
    repo: "widberg/msvc8.0"
    # Pinned commit used by decomp.me's own MSVC8 compiler image, for
    # reproducibility -- bump deliberately, not implicitly on every run.
    ref: "d6c4aa208c8345c78a9f68ba6ef911ee94c6a6e1"
  arch: x86
  # Extra SDK/include roots resolved via env var first, then fallback.
  # DXSDK is NOT auto-downloaded (unlike the MSVC8 toolchain above):
  # Microsoft never published a clean, freely-redistributable standalone
  # mirror of it, so -- same as the base .exe/.pdb -- every contributor
  # needs their own legally obtained copy of the June 2010 DirectX SDK.
  extra_includes:
    - env: "DXSDK_DIR"
      fallback: 'C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)'
      subpath: "Include"

  # Include dirs relative to repo root, always added.
  include_dirs:
    - "src/SexyAppFramework"
    - "src/Popcap/Lawn"
    - "src"

  # Flags applied to every translation unit.
  base_flags: >-
    /nologo /EHsc /MT /O2 /Ob2 /Oi /Gy /GS- /GR-
    /D_CRT_SECURE_NO_DEPRECATE /D_CRT_NONSTDC_NO_DEPRECATE

  # Precompiled header setup. Omit this whole block for compilers/projects
  # that don't use a PCH.
  #  pch:
  #    header: "Precompile.h"
  #    source: "src/Popcap/Lawn/releasebeta/Precompile.cpp"
  #    output: "PlantsVsZombies.pch"
  #    flags: >-
  #      /nologo /Ox /Ob2 /Oi /MT /EHsc /GS- /Gy /GR-
  #      /DBETA_BUILD /DWIN32 /DNDEBUG /D_WINDOWS /D_CRT_SECURE_NO_DEPRECATE
  #      /D_VC80_UPGRADE=0x0700 /D_MBCS /GF /FD /W4 /Zi

  # --- Per-file flag overrides -----------------------------------------
  # Keyed by source path relative to src/. Flags are appended to
  # base_flags for that translation unit. Use {pch_path} as a placeholder
  # for the resolved, quoted PCH path.
  # per_file_flags:
  #  "Popcap/Lawn/releasebeta/TodCommon.cpp": >-
  #    /Ox /Ob2 /Oi /MT /EHsc /GS- /Gy /GR-
  #    /DBETA_BUILD /DWIN32 /DNDEBUG /D_WINDOWS /D_CRT_SECURE_NO_DEPRECATE
  #    /D_VC80_UPGRADE=0x0700 /D_MBCS /GF /FD /W4 /Zi
  #    /YuPrecompile.h /Fp{pch_path}

# --- Linker (relink) ---------------------------------------------------
# Produces build/<version>/PlantsVsZombies.exe from the per-TU objects.
#
# Object selection per translation unit is driven by `status:` below:
#   - "matching":    use the freshly compiled obj from build/<version>/src
#   - "nonmatching": use the original delinked obj from build/<version>/obj
# Anything present in paths.manual but absent from status.matching /
# status.nonmatching defaults to nonmatching, so newly-added mappings are
# safe by default and must be opted into matching explicitly.
#
# Link order matters for MSVC (symbol resolution / library search order can
# subtly affect codegen and, more importantly, can affect whether the linker
# even produces a valid image), so configure.py links objects in the same
# order they appear under paths.manual above, which itself mirrors delink's
# original NNNN_ ordering. Do not reorder paths.manual entries expecting the
# link order to be independent of it.
link:
  # Relinking is temporarily disabled: delink (as of v0.14.0, see the
  # `delink:` block above) doesn't currently pick up on all relocations
  # in the split objects, so a relink of the fully-nonmatching set fails
  # to reproduce a working image. configure.py stops after generating
  # compile-only ninja/objdiff configs while this is false -- everything
  # below stays intact and ready to go the moment it's flipped back to
  # true (nothing else needs to change).
  enabled: false

  # Output binary name, relative to build/<version>/.
  output: "PlantsVsZombies.exe"

  # PE subsystem + linker target type.
  subsystem: "windows" # windows | console
  target: "exe" # exe | dll

  # Matches the original beta's link characteristics as closely as we know
  # them; adjust once objdiff / the linker map disagrees with the original.
  base_address: "0x00400000"
  stack_reserve: "0x100000"
  stack_commit: "0x1000"

  # Extra libs to link, resolved via env/fallback the same way as
  # compiler.vcvarsall (so a fork can point at a different SDK's libs).
  #
  # ddraw.lib/dxguid.lib ship inside the DirectX SDK itself (they did NOT
  # move to the Platform SDK -- that's DirectShow/dshow.h, a different,
  # commonly-confused case). If link fails with LNK1181 on ddraw.lib or
  # dxguid.lib, the DXSDK_DIR install in question is simply missing them
  # (some redistributable DXSDK builds trimmed legacy DirectDraw), not a
  # wrong search path. configure.py verifies each lib in `libs:` actually
  # resolves under one of `lib_dirs:` before generating the link step, and
  # will name the exact missing file rather than deferring to a bare
  # LNK1181 from link.exe. If ddraw.lib truly isn't present in your DXSDK,
  # either point DXSDK_DIR at an older DXSDK release that still ships it,
  # or drop ddraw.lib/dxguid.lib from `libs:` below if the game build
  # doesn't actually need DirectDraw (check whether any TU still calls
  # DirectDrawCreate*/IID_IDirectDraw* first).
  # Note: the bootstrapped MSVC8 toolchain's own Lib/ dir (user32.lib,
  # gdi32.lib, etc., from widberg/msvc8.0's copy of the Platform SDK) is
  # added automatically by configure.py and does not need an entry here.
  lib_dirs:
    - env: "DXSDK_DIR"
      fallback: 'C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)'
      subpath: "Lib/x86"

  # Import libraries linked in, in addition to whatever the .obj files
  # themselves pull in via #pragma comment(lib, ...).
  libs:
    - "user32.lib"
    - "gdi32.lib"
    - "winmm.lib"
    - "ddraw.lib"
    - "dxguid.lib"
    - "dsound.lib"
    - "d3d8.lib"
    - "d3dx8.lib"
    - "wsock32.lib"
    - "comctl32.lib"

  # Raw flags appended verbatim to the link line, for anything not modeled
  # above (e.g. /MAP, /INCREMENTAL:NO).
  #
  # /FORCE:MULTIPLE + /OPT:NOICF is required, not optional, for this
  # workflow. delink's PE-splitter has no compiler front-end, so it can't
  # tell which TU "really" owns a folded/inlined/template symbol; when
  # several TUs reference one, delink copies the definition into every TU
  # that needs it rather than leaving it as an unresolved extern in all
  # but one. The original binary only ever contained a single instance
  # (the original compiler + /OPT:ICF folded them once, permanently, back
  # when it was built) -- these are NOT genuine one-definition-rule
  # violations, they're an artifact of splitting an already-folded binary
  # back into pieces with no ownership information. /FORCE:MULTIPLE tells
  # the linker to pick one instance and keep going (as a warning, not an
  # error); /OPT:NOICF stops the linker from trying to re-fold across TUs
  # itself, which is unnecessary work here and can obscure which symbol
  # "won". Do not remove these once matched objects start replacing
  # nonmatching ones -- freshly compiled matching objects will legitimately
  # re-duplicate the same symbols the delinked objects already duplicate.
  #
  # NOTE: if the linker instead reports the SAME symbol multiply defined
  # WITHIN a single object (e.g. "Foo.obj ... already defined in Foo.obj"),
  # that is a different, more concerning case: it means delink emitted more
  # than one definition for that symbol inside one object file. /FORCE
  # will silently pick one, which is fine if the copies are truly
  # identical, but worth spot-checking (e.g. objdump -t / dumpbin /symbols
  # on the object) before trusting the result, since it could also
  # indicate the .exe and .pdb versions/builds don't actually match.
  extra_flags: >-
    /MAP /OPT:REF /OPT:NOICF /INCREMENTAL:NO /FORCE:MULTIPLE

  # --- Matching status ---------------------------------------------------
  # Keyed by the same flat obj basename used in paths.manual. `__shared_data`
  # is delink's catch-all bucket for read-only/static data that doesn't
  # cleanly attribute to one TU (string literals, vtables that got merged,
  # etc). It is NOT a thing you "match" against a source file — there's no
  # .cpp to write for it — so it should always stay nonmatching and always
  # stays in the link. Leave it out of `matching` entirely.
#  status:
#    matching:
#      - "0028_Plant"
#      - "0039_GameObject"

# --- objdiff ---------------------------------------------------------------
objdiff:
  min_version: "2.0.0-beta.5"
  unit_prefix: "main"
  progress_categories: ["game"]
  watch_patterns:
    - "*.c"
    - "*.cp"
    - "*.cpp"
    - "*.h"
    - "*.hpp"
    - "*.inc"
    - "*.py"
    - "*.yml"
    - "*.txt"
    - "*.json"
